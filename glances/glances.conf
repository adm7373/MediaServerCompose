# Glances configuration — mounted at /etc/glances/glances.conf
# Docs: https://glances.readthedocs.io/en/latest/aoa/fs.html
#
# WHY THIS FILE EXISTS
# By default the fs plugin only lists PHYSICAL devices (hard disks, USB keys).
# /mnt/storage is a mergerfs pool, so its type is `fuse.mergerfs`, which is not
# in the default allow-list — Glances silently hides it even though the
# /mnt/storage:/mnt/storage:ro bind mount is present and `df` works fine inside
# the container. `allow` is the documented fix.

[fs]
# Comma-separated filesystem types to show in addition to physical devices.
allow = fuse.mergerfs

# Hide noisy/pseudo mounts (regex, matched against mount point).
hide = /run.*,/snap.*,/var/lib/docker/.*,/mnt/storage/\..*
