# Personal Media Server Stack Docker Compose File
#
# This file contains the configuration for a personal media server stack using Docker Compose.
# The stack includes services for VPN, torrent client, media server, media management, media request system,
# Plex monitoring, torrent indexer, Usenet downloader, service dashboard, system monitoring, system metrics,
# speed testing, and speed test tracking.
#
# Port Mappings
# ----------------------------------------
# Service         | Port  | Purpose
# ----------------|-------|----------------------------------
# Gluetun         | 8888  | HTTP proxy for VPN tunnel
# qBittorrent     | 8080  | Web UI (via Gluetun)
#                 | 8999  | Incoming connections (via Gluetun)
#                 | 9000  | UDP (via Gluetun)
# Plex            | 32400 | Plex Media Server
# Radarr          | 7878  | Movie management
# Sonarr          | 8989  | TV Show management
# Seerr           | 5055  | Media request management (formerly Overseerr)
# Tautulli        | 8181  | Plex statistics and monitoring
# Jackett         | 9117  | Torrent tracker proxy
# SABnzbd         | 8081  | Usenet downloader
# Organizr        | 8096  | Web-based dashboard
# OpenSpeedTest   | 3000  | Speed test (HTTP)
#                 | 3001  | Speed test (HTTPS)
# SpeedTest Track | 8765  | Speed test monitoring

# SETUP INSTRUCTIONS
# -----------------
# 1. Copy .env.example to .env and fill in your values:
#      cp .env.example .env
#    All secrets, PUID/PGID, timezone, and host paths are configured there
#    instead of directly in this file. `.env` is git-ignored so your real
#    values are never committed.
#
# 2. In your .env file, set PUID/PGID to your user/group IDs
#    Find these by running: id -u (for PUID) and id -g (for PGID)
#
# 3. In your .env file, set TZ to your local timezone
#    Format: Region/City (e.g., America/New_York, Europe/London)
#    List: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
#
# 4. In your .env file, set the media/download path variables:
#    - MOVIES_PATH: Where your movies are stored
#    - TV_PATH: Where your TV shows are stored
#    - DOWNLOADS_PATH: Where downloads should be stored
#
# 5. Configure Mullvad VPN in your .env file (see MULLVAD VPN CONFIGURATION
#    section below for how to obtain WIREGUARD_PRIVATE_KEY, WIREGUARD_ADDRESSES,
#    and SERVER_CITIES)
#
# 6. This stack targets Raspberry Pi 5, which has no supported hardware
#    transcoding path for Plex. No GPU devices or vendor env vars are
#    configured for Plex; all transcoding runs in software on the CPU.
#    Configure Plex clients to use Direct Play/Direct Stream where possible.
#
# 7. Create required directories:
#    mkdir -p {plex,radarr,sonarr,seerr,tautulli,jackett,sabnzbd,organizr,netdata,speedtest-tracker,qbt,unpackerr}/config
#
# 8. Start the stack:
#    docker-compose up -d
#
# 9. Access services through their respective ports (see port mapping table above)

# MULLVAD VPN CONFIGURATION
# ------------------------
# 1. Sign up for Mullvad VPN at https://mullvad.net
# 2. Generate a WireGuard configuration:
#    - Go to https://mullvad.net/en/account/#/wireguard-config
#    - Select "Linux" as your platform
#    - Generate a new key
#    - Download the configuration file
# 3. From the configuration file, you'll need:
#    - PrivateKey: Found in the [Interface] section
#    - Address: Found in the [Interface] section (e.g., 10.x.x.x/32)
# 4. For SERVER_CITIES:
#    - View the full list at: https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#list-of-vpn-servers
#    - Choose one or more cities (comma-separated)
#    - A random server will be chosen from your list each time the container starts
#    Example cities: "Ashburn VA,Atlanta GA,Chicago IL,Dallas TX"

version: "3.8"
services:
  # VPN Gateway (Optional but Highly Recommended)
  # -------------------------------------------
  # Provides VPN tunnel for other containers (specifically qBittorrent)
  # Uses Mullvad WireGuard for secure, fast connection
  # While optional, using a VPN is highly recommended for privacy and security
  # NOTE: If you don't want to use a VPN:
  # 1. Comment out or remove this entire 'gluetun' service block
  # 2. In the qBittorrent service below:
  #    - Remove the 'network_mode: "service:gluetun"' line
  #    - Uncomment the 'ports' section
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}  # Format: "City State" for US cities, just "City" for international
      - SOCKSPROXY=on
      - HTTPPROXY=on
      - TZ=${TZ}
    ports:
      - 8888:8888   # HTTP proxy
      - 8080:8080   # qBittorrent Web UI
      - 8999:8999   # qBittorrent incoming
      - 9000:9000/udp # qBittorrent UDP
    restart: unless-stopped

  # Torrent Client
  # -------------
  # qBittorrent with automatic RAR extraction
  # NOTE: Choose between VPN and non-VPN configuration:
  # For VPN: Keep network_mode: "service:gluetun" (current setup)
  # For non-VPN: Remove network_mode line and uncomment ports section below
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./qbt/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    network_mode: "service:gluetun"  # Routes all traffic through VPN
    depends_on:
      gluetun:
        condition: service_started
    # If not using VPN, remove the network_mode line above and uncomment these ports:
    # ports:
    #   - 8080:8080   # Web UI
    #   - 8999:8999   # Incoming connections
    #   - 9000:9000/udp # UDP
    restart: unless-stopped

  # Media Server
  # -----------
  # Plex Media Server
  # NOTE: This stack targets Raspberry Pi 5, which has no hardware video
  # transcoding path supported by Plex (no Quick Sync/NVENC/VCE, and the
  # VideoCore VII GPU is not usable for Plex HW transcoding). GPU passthrough
  # and Nvidia env vars have intentionally been omitted. All transcoding will
  # run in software on the CPU, which is very limited on a Pi 5 - configure
  # clients to use Direct Play/Direct Stream whenever possible and avoid
  # relying on transcoding. If you move this stack to hardware with a
  # supported GPU (Intel Quick Sync or Nvidia), re-add the appropriate
  # devices/environment variables for that hardware.
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: bridge
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex/config:/config
      - ${MOVIES_PATH}:/media/movies
      - ${TV_PATH}:/media/tv
    ports:
      - 32400:32400
    restart: unless-stopped

  # Movie Management
  # ---------------
  # Automated movie downloading and organization
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
    volumes:
      - ./radarr/config:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  # TV Show Management
  # -----------------
  # Automated TV show downloading and organization
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
    volumes:
      - ./sonarr/config:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  # Media Request System (Seerr - merged Overseerr & Jellyseerr)
  # -----------------------------------------------------------
  # Web-based interface for users to request new movies and TV shows
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  # Plex Monitoring
  # --------------
  # Statistics and analytics for Plex Media Server
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./tautulli/config:/config
    ports:
      - 8181:8181
    restart: unless-stopped

  # Torrent Indexer
  # --------------
  # Proxy for accessing various torrent trackers
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    volumes:
      - ./jackett/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped

  # Usenet Downloader
  # ----------------
  # Binary newsgroup downloader
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sabnzbd/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 8081:8080
    restart: unless-stopped

  # Service Dashboard
  # ---------------
  # Web-based dashboard for organizing and accessing all services
  organizr:
    image: organizr/organizr:latest
    container_name: organizr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./organizr/config:/config
    ports:
      - 8096:80
    restart: unless-stopped

  # Automatic Extraction
  # ------------------
  # Monitors download clients and automatically extracts completed downloads
  # NOTE: The API keys below can only be obtained AFTER setting up Sonarr and Radarr
  # You will need to:
  # 1. Start the stack without worrying about Unpackerr
  # 2. Set up Sonarr and Radarr
  # 3. Get their API keys from Settings → General → Security → API Key
  # 4. Set SONARR_API_KEY and RADARR_API_KEY in your .env file
  # 5. Start Unpackerr
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    depends_on:
      - sonarr
      - radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UN_LOG_FILE=/downloads/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
    restart: unless-stopped

  # System Metrics
  # -------------
  # Real-time system metrics and monitoring
  netdata:
    image: netdata/netdata:latest
    container_name: netdata-monitor
    hostname: netdata
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./netdata/config:/etc/netdata
    environment:
      - DOCKER_FROM_ENV=1
    restart: unless-stopped

  # Speed Testing
  # ------------
  # Network speed test server
  openspeedtest:
    image: openspeedtest/latest
    container_name: openspeedtest
    ports:
      - 3000:3000  # HTTP
      - 3001:3001  # HTTPS
    restart: unless-stopped

  # Speed Test Tracking
  # -----------------
  # Automated speed test monitoring and history
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - 8765:80
    volumes:
      - ./speedtest-tracker/config:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * *
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
    restart: unless-stopped
