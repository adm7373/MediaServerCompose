# Homepage service configuration
# Docs: https://gethomepage.dev/configs/services/
#
# SCHEMA — the document itself IS the list. There is NO top-level `services:`
# key: Homepage loads the file and immediately calls .map() on the parsed
# document, so wrapping it in `services:` throws
# "TypeError: b.map is not a function" and Homepage falls back to its built-in
# GitHub/Reddit/YouTube defaults.
#   - Group Name:        -> groups are TOP-LEVEL entries of the list
#       - Service Name:  -> services are keys inside the group list
#           href: ...          (NOT `url`)
#           siteMonitor: ...   (NOT `healthcheck`)
#
# TWO URLS, TWO PURPOSES — they intentionally differ:
#   href        -> what YOUR BROWSER opens. Keep the friendly LAN name here
#                  (nas.local = placeholder; use your Pi's real hostname/IP).
#   siteMonitor -> what HOMEPAGE fetches, from inside the homepage container,
#                  over the compose network. Uses the container/service name and
#                  the INTERNAL port, so it reports the container's real state
#                  rather than a published port mapping.
#                  Homepage does not require siteMonitor to equal href.
#
# EXCEPTIONS (container name is NOT usable for these):
#   qBittorrent -> network_mode: service:gluetun, so it lives in Gluetun's
#                  namespace and is unreachable by DNS name from homepage.
#   Glances     -> network_mode: host, so it shares the host's network stack
#                  and has no DNS name to resolve.
#   Both use `pi-host` instead: an extra_hosts alias for the host gateway
#   (declared on the homepage service in docker-compose.yml).
#
# NEVER put a .local/mDNS name in a siteMonitor. Docker's embedded DNS resolves
# compose service names only and does not forward mDNS, so a monitor like
# http://nas.local:61208 fails inside the container with
# "queryAaaa ENOTFOUND nas.local". `nas.local` is safe in href: only, because
# that URL is opened by your browser and never fetched by the container.
#
# Services that need credentials (qBittorrent, SABnzbd) have no siteMonitor by
# default — they still show live container status via the mounted Docker socket.

- Media:
    - Plex:
        icon: plex.png
        href: http://nas.local:32400/web
        description: Plex Media Server
        siteMonitor: http://plex:32400/web

    - Seerr:
        icon: seerr.png
        href: http://nas.local:5055
        description: Media request system
        siteMonitor: http://seerr:5055

    - qBittorrent:
        icon: qbittorrent.png
        href: http://nas.local:8080
        description: Torrent client (via VPN)
        # No siteMonitor: not reachable by container name (Gluetun namespace)
        # AND /api/v2/app/version requires auth. To enable, uncomment:
        # siteMonitor: http://pi-host:8080/api/v2/app/version
        # siteMonitorBasicAuth: admin:your-qbt-password

- Automation:
    - Radarr:
        icon: radarr.png
        href: http://nas.local:7878
        description: Movie manager
        siteMonitor: http://radarr:7878/ping

    - Sonarr:
        icon: sonarr.png
        href: http://nas.local:8989
        description: TV show manager
        siteMonitor: http://sonarr:8989/ping

    - Jackett:
        icon: jackett.png
        href: http://nas.local:9117
        description: Indexer proxy
        siteMonitor: http://jackett:9117

    - SABnzbd:
        icon: sabnzbd.png
        href: http://nas.local:8081
        description: Usenet downloader (via VPN)
        # Reachable by name at the INTERNAL port 8080 (8081 is only the host
        # mapping), but every SAB API call needs ?apikey=, so a siteMonitor needs
        # your key. To enable, uncomment:
        # siteMonitor: http://sabnzbd:8080/api/v2/version?apikey=YOUR_SABNZBD_API_KEY

- Infrastructure:
    - Tautulli:
        icon: tautulli.png
        href: http://nas.local:8181
        description: Plex statistics
        siteMonitor: http://tautulli:8181

    - Glances:
        icon: glances.png
        href: http://nas.local:61208
        description: System & container metrics
        # network_mode: host — `glances` does not resolve from this container,
        # so point at the host-gateway alias instead. Keep in mind the API
        # version is pinned in this path (v4); bump it if Glances moves to v5.
        siteMonitor: http://pi-host:61208/api/4/status

    - FlareSolverr:
        href: http://nas.local:8191
        description: Cloudflare bypass proxy for indexers
        siteMonitor: http://flaresolverr:8191

    - Homepage:
        href: http://nas.local:3002
        description: Service dashboard
        # Loopback on purpose. Homepage's own host validation rejects requests
        # whose Host header is not in HOMEPAGE_ALLOWED_HOSTS, so a self-monitor
        # addressed as http://homepage:3000 fails with
        # "Host validation failed for: homepage:3000" and would force you to add
        # homepage:3000 to the allow-list. 127.0.0.1:3000 is always permitted.
        siteMonitor: http://127.0.0.1:3000
