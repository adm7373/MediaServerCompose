# Homepage service configuration
# Docs: https://gethomepage.dev/configs/services/
#
# SCHEMA — the document itself IS the list. There is NO top-level `services:`
# key: Homepage loads the file and immediately calls .map() on the parsed
# document, so wrapping it in `services:` throws
# "TypeError: b.map is not a function" and Homepage falls back to its built-in
# GitHub/Reddit/YouTube defaults.
#   - Group Name:        -> groups are TOP-LEVEL entries of the list
#       - Service Name:  -> services are keys inside the group list
#           href: ...          (NOT `url`)
#           siteMonitor: ...   (NOT `healthcheck`)
#
# NOTE: URLs use "nas.local" as a placeholder — replace with your Pi's LAN
# IP/hostname (or use 127.0.0.1 if you always browse the dashboard from the Pi).
#
# qBittorrent and SABnzbd run inside Gluetun's network namespace, so they are NOT
# reachable by container name from this network — use the Pi's LAN hostname.
# They also require credentials, so by default they only show container status
# (via the mounted Docker socket) instead of an HTTP siteMonitor.

  - Media:
      - Plex:
          icon: plex.png
          href: http://nas.local:32400/web
          description: Plex Media Server
          siteMonitor: http://nas.local:32400/web

      - Seerr:
          icon: seerr.png
          href: http://nas.local:5055
          description: Media request system
          siteMonitor: http://nas.local:5055

      - qBittorrent:
          icon: qbittorrent.png
          href: http://nas.local:8080
          description: Torrent client (via VPN)
          # qBittorrent requires auth even for /api/v2/app/version, so a
          # siteMonitor needs credentials. Uncomment and fill these in:
          # siteMonitor: http://nas.local:8080/api/v2/app/version
          # siteMonitorBasicAuth: admin:your-qbt-password

  - Automation:
      - Radarr:
          icon: radarr.png
          href: http://nas.local:7878
          description: Movie manager
          siteMonitor: http://nas.local:7878/ping

      - Sonarr:
          icon: sonarr.png
          href: http://nas.local:8989
          description: TV show manager
          siteMonitor: http://nas.local:8989/ping

      - Jackett:
          icon: jackett.png
          href: http://nas.local:9117
          description: Indexer proxy
          siteMonitor: http://nas.local:9117

      - SABnzbd:
          icon: sabnzbd.png
          href: http://nas.local:8081
          description: Usenet downloader (via VPN)
          # SABnzbd's API needs ?apikey=... on every request, so a siteMonitor
          # needs your key. Uncomment and fill this in:
          # siteMonitor: http://nas.local:8081/api/v2/version?apikey=YOUR_SABNZBD_API_KEY

  - Infrastructure:
      - Tautulli:
          icon: tautulli.png
          href: http://nas.local:8181
          description: Plex statistics
          siteMonitor: http://nas.local:8181

      - Glances:
          icon: glances.png
          href: http://nas.local:61208
          description: System & container metrics
          siteMonitor: http://nas.local:61208

      - FlareSolverr:
          href: http://nas.local:8191
          description: Cloudflare bypass proxy for indexers
          siteMonitor: http://nas.local:8191/status

      - Homepage:
          href: http://nas.local:3002
          description: Service dashboard
          siteMonitor: http://nas.local:3002
